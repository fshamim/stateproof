# Gradle
org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Release coordinates
stateproofGroup=io.github.fshamim
stateproofVersion=0.8.0-alpha02

# Maven Central publishing configuration
# Set these in ~/.gradle/gradle.properties or CI secrets.
# centralRepositoryUrl defaults to Sonatype Central Portal's OSSRH-compatible endpoint.
centralRepositoryUrl=https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/

# Kotlin
kotlin.code.style=official
kotlin.mpp.stability.nowarn=true

# Android (for future Android target)
android.useAndroidX=true
